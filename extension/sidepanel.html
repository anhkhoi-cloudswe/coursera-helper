<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coursera Helper Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="side-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div>
          <h2>Coursera Helper</h2>
          <span class="version-badge">Side Panel Cố Định</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="btnToggleSettings" title="Cài đặt Gemini API Key">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button class="icon-btn" id="btnOpenWeb" title="Mở trang Web đầy đủ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
      </div>
    </header>

    <!-- Collapsible Settings Panel -->
    <div class="settings-box" id="settingsBox" style="display: none;">
      <div class="settings-head">
        <span>Cấu hình Gemini API</span>
        <button class="btn-close" id="btnCloseSettings">✕</button>
      </div>
      <input type="password" id="apiKeyInput" placeholder="Nhập API Key (AIzaSy...)" class="input-text">
      <div class="settings-row">
        <select id="modelSelect" class="select-box">
          <option value="gemini-2.0-flash" selected>Gemini 2.0 Flash (Mặc định - Siêu tốc & Chuẩn xác)</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash (Ổn định, phản hồi nhanh)</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro (Chi tiết sâu, bài khó)</option>
        </select>
        <button class="btn btn-primary" id="btnSaveKey">Lưu</button>
      </div>
      <div class="settings-tip">
        Khóa lưu cục bộ trong máy bạn, lấy miễn phí tại <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio ↗</a>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
        <input type="checkbox" id="chkAutoFillQuiz" checked style="accent-color: #10b981; width: 14px; height: 14px; cursor: pointer;">
        <label for="chkAutoFillQuiz" style="font-size: 11px; color: #cbd5e1; cursor: pointer; user-select: none;">
          🎯 Tự động tick chọn đáp án trên Coursera khi giải xong
        </label>
      </div>
    </div>

    <!-- Quick Toolbar -->
    <div class="quick-bar">
      <button class="btn btn-ai btn-sm" id="btnAutoScanSolve" title="Tự động quét toàn bộ câu hỏi (kèm hình ảnh) và tự động tick trên Coursera">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -1px; margin-right: 2px;"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
        ⚡ Quét & Tự Giải
      </button>
      <button class="btn btn-primary btn-sm" id="btnGrabCoursera" title="Lấy câu hỏi đang bôi đen trên Coursera">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -1px; margin-right: 2px;"><path d="M7 16a4 4 0 0 1-.88-7.903A5 5 0 1 1 15.9 6L16 6a5 5 0 0 1 1 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        Lấy chữ
      </button>
      <button class="btn btn-default btn-sm" id="btnPaste" title="Dán nội dung từ Clipboard">Dán</button>
      <button class="btn btn-ghost btn-sm" id="btnClear" title="Xóa toàn bộ văn bản">Xóa</button>
    </div>

    <!-- Section 1: Raw Input -->
    <div class="panel-box input-panel">
      <div class="panel-head">
        <span>1. Văn bản câu hỏi</span>
        <span class="char-count" id="inputCount">0 ký tự</span>
      </div>
      <textarea id="rawInput" placeholder="Bôi đen câu hỏi trên Coursera rồi bấm 'Lấy chữ', hoặc bấm 'Dán'..."></textarea>
    </div>

    <!-- Section 2: Output & AI Solution -->
    <div class="panel-box output-panel">
      <div class="panel-head">
        <!-- Segmented Tab -->
        <div class="tab-group">
          <button class="tab-btn active" id="tabClean">Văn bản sạch</button>
          <button class="tab-btn" id="tabAi">Đáp án Gemini ✨</button>
        </div>

        <div class="action-group">
          <button class="btn btn-emerald btn-sm" id="btnCopyClean" title="Copy kết quả sạch">
            Copy sạch
          </button>
          <button class="btn btn-default btn-sm" id="btnCopyPrompt" title="Copy kèm prompt để dán web Gemini">
            Prompt
          </button>
          <button class="btn btn-ai btn-sm" id="btnSolve" title="Gọi Gemini giải đáp án ngay trên thanh bên">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
            Giải
          </button>
        </div>
      </div>

      <!-- View 1: Cleaned Text -->
      <div class="view-panel active" id="viewClean">
        <textarea id="cleanOutput" readonly placeholder="Nội dung sau khi lọc bẫy injection và '1 point' sẽ tự động hiện ở đây..."></textarea>
      </div>

      <!-- View 2: Gemini AI Markdown Result -->
      <div class="view-panel" id="viewAi">
        <div class="ai-content" id="aiContent">
          <div class="ai-empty-state">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" style="opacity: 0.6; margin-bottom: 8px;"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
            <p>Bấm nút <strong>"Giải"</strong> để nhận đáp án và giải thích chi tiết từ Gemini!</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Persistent Status Footer -->
    <footer class="side-footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="footerStatus">Auto-clean khi Ctrl+C đang hoạt động</span>
      </div>
      <div class="author-mark">Made by <strong>Anh Khoi Nguyen</strong></div>
    </footer>
  </div>

  <div class="toast" id="toast">Đã sao chép!</div>

  <script src="sidepanel.js"></script>
</body>
</html>
