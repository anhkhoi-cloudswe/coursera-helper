<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coursera Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div>
          <h2>Coursera Helper</h2>
          <span class="badge">Extension PRO</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnToggleSettings" title="Cài đặt Gemini API Key">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button class="icon-btn" id="btnOpenWeb" title="Mở trang Web đầy đủ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
      </div>
    </header>

    <!-- Collapsible Settings Panel -->
    <div class="settings-panel" id="settingsPanel" style="display: none;">
      <div class="settings-title">Cài đặt Gemini API</div>
      <input type="password" id="apiKeyInput" placeholder="Nhập API Key (AIzaSy...)" class="input-text">
      <div class="settings-row">
        <select id="modelSelect" class="select-box">
          <option value="gemini-2.0-flash" selected>Gemini 2.0 Flash</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </select>
        <button class="btn btn-primary" id="btnSaveKey">Lưu</button>
      </div>
    </div>

    <!-- Main Workspace -->
    <main class="main-body">
      <!-- Input Section -->
      <div class="section-box">
        <div class="section-header">
          <span>1. Văn bản Coursera</span>
          <div class="btn-group">
            <button class="btn btn-sm btn-primary" id="btnPaste">Dán</button>
            <button class="btn btn-sm btn-ghost" id="btnClear">Xóa</button>
          </div>
        </div>
        <textarea id="inputArea" placeholder="Dán câu hỏi Coursera vào đây..."></textarea>
      </div>

      <!-- Output Section -->
      <div class="section-box">
        <div class="section-header">
          <span>2. Kết quả sạch / AI</span>
          <div class="btn-group">
            <button class="btn btn-sm btn-emerald" id="btnCopyClean">Copy sạch</button>
            <button class="btn btn-sm btn-default" id="btnCopyPrompt">Prompt</button>
            <button class="btn btn-sm btn-ai" id="btnSolve">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
              Gemini
            </button>
          </div>
        </div>
        <textarea id="outputArea" readonly placeholder="Kết quả sạch sẽ hiển thị tại đây..."></textarea>
      </div>
    </main>

    <!-- Footer Stats -->
    <footer class="footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="statusText">Auto-clean khi Ctrl+C trên Coursera đang BẬT</span>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast">Đã sao chép!</div>

  <script src="popup.js"></script>
</body>
</html>
